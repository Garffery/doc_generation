[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-generation"
version = "0.1.0"
description = "Document generation utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langchain>=0.3",
  "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
doc-generation = "doc_generation.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_generation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
