[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-generation"
version = "0.1.0"
description = "Document generation utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-chroma>=0.2",
  "langchain-openai>=0.3",
  "langchain-deepseek>=1.0",
  "langchain-text-splitters>=0.3",
  "chromadb>=0.5",
  "typing-extensions>=4.0",
  "claude-code-sdk>=0.0.25",
  "langsmith>=0.3",
  "motor>=3.0",
  "tavily-python>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
doc-generation = "doc_generation.main:main"
doc-generation-rag-ingest = "doc_generation.rag.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_generation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s [%(name)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
