stages:
  prod:
    cognition:
      openai:
        base_url: https://api.zhizengzeng.com/v1
        api_key: your-openai-api-key-here
        organization: dingshixiong
        default_model: gpt-5.4-mini
        temperature: 0
        timeout_seconds: 600
        models:
          gpt-5.4-mini:
            max_tokens: 128000
      deepseek:
        base_url: https://api.zhizengzeng.com/v1
        api_key: sk-zk2f62f8abfee2397b81f857078fa72ca8c6a0b3001723a4
        default_model: deepseek-v4-flash
        temperature: 0
        timeout_seconds: 600
        models:
          deepseek-v4:
            max_tokens: 128000
    rag:
      enabled: true
      backend: chroma
      chroma:
        persist_directory: data/chroma
        collection_name: doc_generation
        embedding_model: bge-m3
        api_key: aaaa
        base_url: http://127.0.0.1:11434/v1
        top_k: 5
        # score_threshold: 1.5
    search:
      backend: tavily
      tavily:
        api_key: tvly-dev-xxxx
        base_url: https://api.tavily.com
        max_results: 3
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    claude_code:
      cwd: D:\project\project_data
    roles:
      supervisor:
        backend: deepseek
        handle: deepseek-v4-pro
        max_tokens: 128000
        timeout_seconds: 600
      red_team:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      context_pruner:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      researcher_main:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      researcher_summarizer:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      researcher_compressor:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      writer:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      draft:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
      evaluator:
        backend: deepseek
        handle: deepseek-v4-flash
        max_tokens: 128000
        timeout_seconds: 600
    skills:
      # Pluggable storage backend (module:Class)
      use: doc_generation.skills.storage.local_skill_storage:LocalSkillStorage
      path: skills
      # Global enable list; omit to enable all discovered skills
      enabled:
        - erlang-player-data-storage
        - erlang-socket-protocol-doc
      # inline: inject SKILL.md body into prompt; catalog: list paths only (deer-flow style)
      mode: inline
      agents:
        draft:
          write_research_brief:
            skills:
              - erlang-player-data-storage
          write_draft_report:
            skills:
              - erlang-player-data-storage
              - erlang-socket-protocol-doc
