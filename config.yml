stages:
  prod:
    cognition:
      openai:
        base_url: https://api.openai.com/v1
        api_key: your-openai-api-key-here
        organization: dingshixiong
        default_model: gpt-5.4-mini
        temperature: 0
        timeout_seconds: 600
        models:
          gpt-5.4-mini:
            max_tokens: 128000
    rag:
      enabled: true
      backend: chroma
      chroma:
        persist_directory: data/chroma
        collection_name: doc_generation
        embedding_model: text-embedding-3-small
        top_k: 5
        # score_threshold: 1.5
    search:
      backend: tavily
      tavily:
        api_key: tvly-dev-xxxx
        base_url: https://api.tavily.com
        max_results: 3
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    roles:
      supervisor:
        backend: openai
        handle: gpt-5.4-nano 
        max_tokens: 128000
        timeout_seconds: 600
      red_team:
        backend: openai
        handle: gpt-5.4-mini 
        max_tokens: 128000
        timeout_seconds: 600
      context_pruner:
        backend: openai
        handle: gpt-5.4-nano 
        max_tokens: 128000
        timeout_seconds: 600
      researcher_main:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 600
      researcher_summarizer:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 600
      researcher_compressor:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 600
      writer:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 600
      draft:
        backend: openai
        handle: gpt-5.4-mini
        max_tokens: 128000
        timeout_seconds: 600
      evaluator:
        backend: openai
        handle: gpt-5.4-nano 
        max_tokens: 128000
        timeout_seconds: 600
    skills:
      # Pluggable storage backend (module:Class)
      use: doc_generation.skills.storage.local_skill_storage:LocalSkillStorage
      path: skills
      # Global enable list; omit to enable all discovered skills
      enabled:
        - erlang-player-data-storage
        - erlang-socket-protocol-doc
      # inline: inject SKILL.md body into prompt; catalog: list paths only (deer-flow style)
      mode: inline
      agents:
        draft:
          write_research_brief:
            skills:
              - erlang-player-data-storage
          write_draft_report:
            skills:
              - erlang-player-data-storage
              - erlang-socket-protocol-doc
