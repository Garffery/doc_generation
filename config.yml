stages:
  prod:
    resilience:
      retry:
        max_attempts: 3
        base_delay: 1.0
        max_delay: 30.0
        jitter: true
      circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 60
        success_threshold: 2
      watchdog:
        default_timeout: 120
      fallback:
        static_response: "系统暂时无法处理您的请求，请稍后重试。"
    cognition:
      openai:
        base_url: https://api.zhizengzeng.com/v1
        api_key: sk-zk2f62f8abfee2397b81f857078fa72ca8c6a0b3001723a4
        organization: dingshixiong
        default_model: gpt-5.4-mini
        temperature: 0
        timeout_seconds: 60
        models:
          gpt-5.4-mini:
            max_tokens: 128000
      deepseek:
        base_url: https://api.zhizengzeng.com/v1
        api_key: sk-zk2f62f8abfee2397b81f857078fa72ca8c6a0b3001723a4
        default_model: deepseek-v4-flash
        temperature: 0
        timeout_seconds: 60
        models:
          deepseek-v4:
            max_tokens: 128000
    rag:
      enabled: true
      backend: chroma
      chroma:
        persist_directory: data/chroma
        collection_name: doc_generation
        embedding_model: bge-m3
        api_key: aaaa
        base_url: http://127.0.0.1:11434/v1
        top_k: 5
        # score_threshold: 1.5
    search:
      backend: tavily
      tavily:
        api_key: tvly-dev-xxxx
        base_url: https://api.tavily.com
        max_results: 3
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    graph:
      recursion_limit: 50
    claude_code:
      cwd: D:\project\project_data
    roles:
      supervisor:
        backend: openai
        handle: gpt-5.4-mini
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
          - static: "Supervisor暂时不可用，流程终止。"
      red_team:
        backend: openai
        handle: gpt-5.4-mini
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
      context_pruner:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
      researcher_main:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
      researcher_summarizer:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
      researcher_compressor:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
      writer:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
          - static: "报告生成暂时不可用，请稍后重试。"
      draft:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
          - static: "草稿生成暂时不可用，请稍后重试。"
      evaluator:
        backend: openai
        handle: gpt-5.4-nano
        max_tokens: 128000
        timeout_seconds: 60
        fallback_chain:
          - backend: deepseek
            handle: deepseek-v4-flash
    skills:
      # Pluggable storage backend (module:Class)
      use: doc_generation.skills.storage.local_skill_storage:LocalSkillStorage
      path: skills
      # Global enable list; omit to enable all discovered skills
      enabled:
        - erlang-player-data-storage
        - erlang-socket-protocol-doc
      # inline: inject SKILL.md body into prompt; catalog: list paths only (deer-flow style)
      mode: inline
      agents:
        draft:
          write_research_brief:
            skills:
              - erlang-player-data-storage
          write_draft_report:
            skills:
              - erlang-player-data-storage
              - erlang-socket-protocol-doc
